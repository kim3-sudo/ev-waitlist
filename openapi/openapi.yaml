openapi: 3.1.0
info:
  title: Plugyard REST API
  version: 1.0.0
  summary: Manage charge points, zones, waitlists, charges, pricing, and driver alerts for one site.
  description: |
    The REST API lets your own systems read and manage one site of your charging
    network: charge points and their status, zones, the waitlist, charges, surge
    pricing and complimentary charging, driver alerts, complaints, and reports.

    ## Getting access

    Access belongs to a **service account**, not to a person. An administrator
    creates a service account in the admin app under **API access**, chooses the
    permissions it should have, and creates an API key for it. The full key is
    shown once, when it is created. Store it somewhere safe; if it is lost, create
    a new key and revoke the old one.

    Send the key with every request:

    ```
    Authorization: Bearer pgk_...
    ```

    Each key works for the site its service account belongs to. Requests cannot
    reach another site.

    ## Permissions

    Every operation lists the permission it needs in `x-required-permission`.
    A request without the permission gets `403 Forbidden`, and the response names
    the missing permissions in `missing`. Read operations need a `read` permission;
    changes need `write`, `manage`, or `control`.

    ## Responses and errors

    Bodies are JSON. Timestamps are ISO 8601 in UTC. Every error has an `error`
    message, and most have a `code`:

    | Status | Meaning |
    | ------ | ------- |
    | 400 | The request is not valid. `error` says what to fix. |
    | 401 | The key is missing, malformed, revoked, expired, or belongs to a disabled service account. |
    | 403 | The key does not have the permission this operation needs (see `missing`). |
    | 404 | The item does not exist on this site. |
    | 405 | The resource is read-only through the API. |
    | 409 | The request conflicts with the current state. For commands that end a session, retry with `confirmEndSession: true` once the driver has been told. |
    | 502 | The charge point did not answer the command. |

    List endpoints return a page: `{ "data": [...], "nextCursor": "..." }`. Ask for
    more with `limit` (1 to 200, default 50) and `cursor`, using the `nextCursor` from
    the previous page. `nextCursor` is null on the last page. Pages stay stable when
    items are added or removed between requests.

    ## Personal data

    The API does not return driver names, contact details, licence plates, or
    payment links. Waitlist entries show position and status only, and charges
    omit payer details.

    ## Changing the spec

    This document is the source of truth for the API. The reference page is built
    from it by `npm run docs:api:build`.
  contact:
    name: Plugyard support
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

servers:
  - url: /api/v1
    description: This server (same origin as the admin app)

security:
  - bearerAuth: []

tags:
  - name: Account
    description: Who the key belongs to and what it can do.
  - name: Charge points
    description: Charge points (stations), their status, and connectors.
  - name: Commands
    description: Commands sent to a charge point. A charge point that is offline cannot receive them.
  - name: Zones
    description: Groups of charge points that share one waitlist.
  - name: Waitlist
    description: Drivers waiting for a charge point or zone.
  - name: Charges
    description: Completed and pending charges for sessions.
  - name: Price rules
    description: Surge pricing and complimentary charging.
  - name: Alerts
    description: Messages shown to drivers.
  - name: Complaints
    description: Line-cutting complaints from drivers.
  - name: Reports
    description: Aggregates for dashboards.

paths:
  /me:
    get:
      tags: [Account]
      operationId: getMe
      summary: Get the calling service account
      description: Returns the service account and the permissions its key holds. Use it to check a key works.
      x-required-permission: none
      responses:
        '200':
          description: The service account and its site.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /stations:
    get:
      tags: [Charge points]
      operationId: listStations
      summary: List charge points
      x-required-permission: api.stations.read
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: All charge points on the site, by name.
          content:
            application/json:
              schema:
                type: object
                required: [data, nextCursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Station'
                  nextCursor:
                    type: [string, 'null']
                    description: Pass as cursor to get the next page. Null on the last page.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Charge points]
      operationId: createStation
      summary: Add a charge point
      x-required-permission: api.stations.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StationInput'
      responses:
        '201':
          description: The charge point was added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Station'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /stations/{id}:
    parameters:
      - $ref: '#/components/parameters/StationId'
    get:
      tags: [Charge points]
      operationId: getStation
      summary: Get a charge point
      x-required-permission: api.stations.read
      responses:
        '200':
          description: The charge point.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Station'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Charge points]
      operationId: updateStation
      summary: Change a charge point
      description: Sends the whole charge point. Fields left out keep their current value. Changing `connectorCount` adds or removes connectors.
      x-required-permission: api.stations.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StationInput'
      responses:
        '200':
          description: The updated charge point.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Station'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Charge points]
      operationId: deleteStation
      summary: Remove a charge point
      x-required-permission: api.stations.write
      responses:
        '204':
          description: The charge point was removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /stations/{id}/auth-key:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Charge points]
      operationId: rotateStationAuthKey
      summary: Make a new connection key
      description: Replaces the charge point's connection key (or gives one to a charge point that has none). The charge point is disconnected and must reconnect with the new key, which is returned once.
      x-required-permission: api.stations.write
      responses:
        '200':
          description: The new key.
          content:
            application/json:
              schema:
                type: object
                required: [authKey]
                properties:
                  authKey:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /stations/{id}/status:
    parameters:
      - $ref: '#/components/parameters/StationId'
    get:
      tags: [Charge points]
      operationId: getStationStatus
      summary: Get live status and recent history
      description: Connector states, the current session on each connector, and the most recent events. Add `refresh=1` to ask an online charge point for its current status first.
      x-required-permission: api.stations.read
      parameters:
        - name: refresh
          in: query
          required: false
          description: Use `1` to ask the charge point for fresh status before answering.
          schema:
            type: string
            enum: ['1']
      responses:
        '200':
          description: The status and history.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /stations/{id}/waitlist:
    parameters:
      - $ref: '#/components/parameters/StationId'
    get:
      tags: [Waitlist]
      operationId: listStationWaitlist
      summary: List the waitlist for a charge point
      description: Drivers waiting for this charge point, in order. Names and contact details are never returned.
      x-required-permission: api.waitlist.read
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Waiting and notified drivers, in order.
          content:
            application/json:
              schema:
                type: object
                required: [data, nextCursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WaitlistEntry'
                  nextCursor:
                    type: [string, 'null']
                    description: Pass as cursor to get the next page. Null on the last page.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /stations/{stationId}/transactions/{transactionId}/stop:
    parameters:
      - $ref: '#/components/parameters/StationIdCmd'
      - name: transactionId
        in: path
        required: true
        description: The open session to stop.
        schema:
          type: string
    post:
      tags: [Commands]
      operationId: stopTransaction
      summary: Stop a charging session
      description: Asks the charge point to stop the session. A `200` means the stop was requested; the session ends when the charge point confirms it.
      x-required-permission: api.stations.control
      responses:
        '200':
          $ref: '#/components/responses/CommandAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/CommandFailed'

  /stations/{stationId}/trigger:
    parameters:
      - $ref: '#/components/parameters/StationIdCmd'
    post:
      tags: [Commands]
      operationId: triggerMessage
      summary: Ask a charge point to send a message
      x-required-permission: api.stations.control
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestedMessage]
              properties:
                requestedMessage:
                  type: string
                  enum:
                    - BootNotification
                    - Heartbeat
                    - StatusNotification
                    - MeterValues
                    - DiagnosticsStatusNotification
                    - FirmwareStatusNotification
                connectorId:
                  type: integer
                  minimum: 1
                  description: Needed for StatusNotification and MeterValues.
      responses:
        '200':
          $ref: '#/components/responses/CommandAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/CommandFailed'

  /stations/{stationId}/connectors/{connectorId}/unlock:
    parameters:
      - $ref: '#/components/parameters/StationIdCmd'
      - $ref: '#/components/parameters/ConnectorId'
    post:
      tags: [Commands]
      operationId: unlockConnector
      summary: Unlock a connector
      description: If a session is in progress on the connector, unlocking ends it. The request is refused with `needsConfirmation` until `confirmEndSession` is `true`.
      x-required-permission: api.stations.control
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmEndSession'
      responses:
        '200':
          $ref: '#/components/responses/CommandAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/NeedsConfirmation'
        '502':
          $ref: '#/components/responses/CommandFailed'

  /stations/{stationId}/reset:
    parameters:
      - $ref: '#/components/parameters/StationIdCmd'
    post:
      tags: [Commands]
      operationId: resetStation
      summary: Restart a charge point
      description: A soft reset restarts the charge point's software. A hard reset power-cycles it. Any sessions in progress end, so the request is refused with `needsConfirmation` until `confirmEndSession` is `true`.
      x-required-permission: api.stations.control
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: [Soft, Hard]
                  default: Soft
                confirmEndSession:
                  type: boolean
                  default: false
      responses:
        '200':
          $ref: '#/components/responses/CommandAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/NeedsConfirmation'
        '502':
          $ref: '#/components/responses/CommandFailed'

  /stations/{stationId}/connectors/{connectorId}/availability:
    parameters:
      - $ref: '#/components/parameters/StationIdCmd'
      - $ref: '#/components/parameters/ConnectorId'
    post:
      tags: [Commands]
      operationId: setConnectorAvailability
      summary: Make a connector available or unavailable
      x-required-permission: api.stations.control
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operative]
              properties:
                operative:
                  type: boolean
                  description: "`true` makes the connector available; `false` takes it out of service."
      responses:
        '200':
          $ref: '#/components/responses/CommandAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/CommandFailed'

  /stations/{stationId}/configuration:
    parameters:
      - $ref: '#/components/parameters/StationIdCmd'
    get:
      tags: [Commands]
      operationId: getConfiguration
      summary: Read the charge point's configuration
      description: The configuration as last read from the charge point. Add `refresh=1` to read it again from an online charge point first.
      x-required-permission: api.stations.control
      parameters:
        - name: refresh
          in: query
          required: false
          schema:
            type: string
            enum: ['1']
      responses:
        '200':
          description: Configuration keys and their values.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /stations/{stationId}/configuration/{key}:
    parameters:
      - $ref: '#/components/parameters/StationIdCmd'
      - name: key
        in: path
        required: true
        description: One of the configuration keys the API allows to be changed (for example `HeartbeatInterval`).
        schema:
          type: string
          enum:
            - HeartbeatInterval
            - MeterValueSampleInterval
            - MeterValuesSampledData
            - StopTxnSampledData
            - ClockAlignedDataInterval
            - ConnectionTimeOut
            - AuthorizeRemoteTxRequests
            - LocalPreAuthorize
            - AuthorizationCacheEnabled
            - StopTransactionOnEVSideDisconnect
            - UnlockConnectorOnEVSideDisconnect
    put:
      tags: [Commands]
      operationId: setConfiguration
      summary: Change one configuration key
      x-required-permission: api.stations.control
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: The value was saved and the charge point answered.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/CommandFailed'

  /stations/{stationId}/clear-cache:
    parameters:
      - $ref: '#/components/parameters/StationIdCmd'
    post:
      tags: [Commands]
      operationId: clearAuthorizationCache
      summary: Clear the charge point's authorization cache
      description: Makes the charge point check every driver again, for example after a driver's data is erased.
      x-required-permission: api.stations.control
      responses:
        '200':
          $ref: '#/components/responses/CommandAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/CommandFailed'

  /stations/{stationId}/connectors/{connectorId}/hold:
    parameters:
      - $ref: '#/components/parameters/StationIdCmd'
      - $ref: '#/components/parameters/ConnectorId'
    post:
      tags: [Commands]
      operationId: holdConnector
      summary: Hold a connector for a driver
      description: Reserves the connector for a driver's ID tag for a number of minutes.
      x-required-permission: api.stations.control
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idTag, minutes]
              properties:
                idTag:
                  type: string
                  maxLength: 20
                minutes:
                  type: integer
                  minimum: 1
                  maximum: 480
                note:
                  type: string
                  maxLength: 200
      responses:
        '201':
          description: The hold was placed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /stations/{stationId}/holds/{reservationId}:
    parameters:
      - $ref: '#/components/parameters/StationIdCmd'
      - name: reservationId
        in: path
        required: true
        description: The hold to release.
        schema:
          type: string
    delete:
      tags: [Commands]
      operationId: releaseHold
      summary: Release a hold
      x-required-permission: api.stations.control
      responses:
        '204':
          description: The hold was released.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /zones:
    get:
      tags: [Zones]
      operationId: listZones
      summary: List zones
      x-required-permission: api.zones.read
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: All zones, by name.
          content:
            application/json:
              schema:
                type: object
                required: [data, nextCursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Zone'
                  nextCursor:
                    type: [string, 'null']
                    description: Pass as cursor to get the next page. Null on the last page.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Zones]
      operationId: createZone
      summary: Create a zone
      x-required-permission: api.zones.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZoneInput'
      responses:
        '201':
          description: The zone was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zone'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /zones/{id}:
    parameters:
      - $ref: '#/components/parameters/ZoneId'
    put:
      tags: [Zones]
      operationId: updateZone
      summary: Rename a zone
      x-required-permission: api.zones.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZoneInput'
      responses:
        '200':
          description: The zone was renamed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zone'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Zones]
      operationId: deleteZone
      summary: Delete a zone
      description: A zone must have no charge points and nobody waiting.
      x-required-permission: api.zones.write
      responses:
        '204':
          description: The zone was deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /waitlist/{id}:
    parameters:
      - $ref: '#/components/parameters/WaitlistId'
    get:
      tags: [Waitlist]
      operationId: getWaitlistEntry
      summary: Get a waitlist entry
      x-required-permission: api.waitlist.read
      responses:
        '200':
          description: The entry and its position in line.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitlistEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Waitlist]
      operationId: cancelWaitlistEntry
      summary: Cancel a waitlist entry
      description: Removes the driver from the line and releases any reservation they held.
      x-required-permission: api.waitlist.manage
      responses:
        '204':
          description: The entry was cancelled.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /charges:
    get:
      tags: [Charges]
      operationId: listCharges
      summary: List charges
      x-required-permission: api.charges.read
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          required: false
          description: Only charges with this status.
          schema:
            type: string
            enum: [PENDING, PAID, NEEDS_REVIEW, NO_CHARGE]
      responses:
        '200':
          description: Charges, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data, nextCursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Charge'
                  nextCursor:
                    type: [string, 'null']
                    description: Pass as cursor to get the next page. Null on the last page.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /charges/{id}:
    parameters:
      - name: id
        in: path
        required: true
