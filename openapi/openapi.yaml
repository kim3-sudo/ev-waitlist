      x-required-permission: api.reports.read
      parameters:
        - $ref: '#/components/parameters/ReportDays30'
      responses:
        '200':
          description: Energy delivered per charge point and per day.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /reports/usage:
    get:
      tags: [Reports]
      operationId: getUsageReport
      summary: Report on charge point usage
      x-required-permission: api.reports.read
      parameters:
        - name: days
          in: query
          required: false
          description: How many days back to look (1 to 90).
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 7
      responses:
        '200':
          description: Session counts and time in use per charge point and per day.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An API key from a service account, starting `pgk_`. Created in the admin app under API access.

  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: How many items to return on this page (1 to 200).
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: The nextCursor from the previous page. Leave out for the first page.
      schema:
        type: string
    StationId:
      name: id
      in: path
      required: true
      description: The charge point's ID.
      schema:
        type: string
    StationIdCmd:
      name: stationId
      in: path
      required: true
      description: The charge point's ID.
      schema:
        type: string
    ConnectorId:
      name: connectorId
      in: path
      required: true
      description: The connector number on the charge point (1 and up).
      schema:
        type: integer
        minimum: 1
    ZoneId:
      name: id
      in: path
      required: true
      schema:
        type: string
    WaitlistId:
      name: id
      in: path
      required: true
      description: The waitlist entry's ID.
      schema:
        type: string
    PriceRuleId:
      name: id
      in: path
      required: true
      schema:
        type: string
    AlertId:
      name: id
      in: path
      required: true
      schema:
        type: string
    ReportDays30:
      name: days
      in: query
      required: false
      description: How many days back to look (1 to 365).
      schema:
        type: integer
        minimum: 1
        maximum: 365
        default: 30

  responses:
    CommandAccepted:
      description: The charge point was asked to do it. The result shows on the charge point's status once it confirms.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    Unauthorized:
      description: The key is missing, malformed, revoked, expired, or belongs to a disabled service account.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The key does not have the permission this operation needs.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForbiddenError'
    NotFound:
      description: The item does not exist on this site.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: The request is not valid. `error` says what to fix.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The request conflicts with the current state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NeedsConfirmation:
      description: "The charge point has a session in progress that this request would end. Repeat the request with `confirmEndSession: true` to go ahead."
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                properties:
                  needsConfirmation:
                    type: boolean
                    enum: [true]
    CommandFailed:
      description: The charge point did not answer. `error` says why.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: What went wrong, in words a person can read.
        code:
          type: string
          description: A short code for the kind of error, when there is one.
          enum: [UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, METHOD_NOT_ALLOWED]
      example:
        error: Station not found

    ForbiddenError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            missing:
              type: array
              description: The permissions the key lacks for this operation.
              items:
                type: string
      example:
        error: This API key does not allow this
        code: FORBIDDEN
        missing: [api.stations.write]

    Me:
      type: object
      required: [serviceAccount, site, permissions]
      properties:
        serviceAccount:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
        site:
          type: [object, 'null']
          properties:
            slug:
              type: string
            name:
              type: string
        permissions:
          type: array
          items:
            type: string
            pattern: '^api\.'

    Connector:
      type: object
      properties:
        connectorId:
          type: integer
          minimum: 1
        status:
          type: string
          description: The last status the charge point reported, such as Available, Preparing, Charging, Faulted, or Unavailable.
        errorCode:
          type: [string, 'null']
        operative:
          type: boolean
          description: Whether the connector is in service. False takes it out of dispatch.
        standard:
          type: [string, 'null']
          description: Connector standard, published to roaming partners.
        format:
          type: [string, 'null']
        powerType:
          type: [string, 'null']
        maxVoltage:
          type: [integer, 'null']
        maxAmperage:
          type: [integer, 'null']

    Station:
      type: object
      required: [id, identity, name, zoneId, connectors]
      properties:
        id:
          type: string
        identity:
          type: string
          description: The charge point's OCPP identity (the name it connects with).
        name:
          type: string
        vendor:
          type: [string, 'null']
        model:
          type: [string, 'null']
        location:
          type: [string, 'null']
        latitude:
          type: [number, 'null']
        longitude:
          type: [number, 'null']
        zoneId:
          type: [string, 'null']
        zoneName:
          type: [string, 'null']
        hasAuthKey:
          type: boolean
          description: Whether the charge point has a connection key. Charge points without one can connect with the identity alone, unless the server sets OCPP_REQUIRE_AUTH=1.
        authKey:
          type: string
          description: The connection key (the OCPP Basic-auth password). Returned only when the charge point is added, and never again. Make a new one with POST /stations/{id}/auth-key.
        online:
          type: boolean
          description: Whether the charge point is connected right now.
        lastSeenAt:
          type: [string, 'null']
          format: date-time
        offlineSince:
          type: [string, 'null']
          format: date-time
        meterStatus:
          type: [string, 'null']
        faulted:
          type: boolean
        connectors:
          type: array
          items:
            $ref: '#/components/schemas/Connector'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    StationInput:
      type: object
      required: [identity, name]
      properties:
        identity:
          type: string
          description: The OCPP identity the charge point connects with. Must be unique on the site.
        name:
          type: string
        vendor:
          type: string
        model:
          type: string
        location:
          type: string
        zoneId:
          type: [string, 'null']
        latitude:
          type: [number, 'null']
          minimum: -90
          maximum: 90
        longitude:
          type: [number, 'null']
          minimum: -180
          maximum: 180
        connectorCount:
          type: integer
          minimum: 0
          default: 1
          description: How many connectors the charge point has (numbered from 1).
        connectors:
          type: array
          description: Optional details for each connector (standard, format, power type). Published to roaming partners.
          items:
            $ref: '#/components/schemas/Connector'

    Zone:
      type: object
      required: [id, name, stations, waitingCount]
      properties:
        id:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        stations:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              identity:
                type: string
        waitingCount:
          type: integer
          description: How many drivers are waiting for this zone.

    ZoneInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1

    WaitlistEntry:
      type: object
      description: A driver in line. Names, contact details, and licence plates are never returned.
      required: [id, status, stationId, zoneId, position, createdAt]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [WAITING, NOTIFIED, COMPLETED, CANCELLED, EXPIRED]
        stationId:
          type: [string, 'null']
        zoneId:
          type: [string, 'null']
        stationName:
          type: [string, 'null']
          description: The charge point the driver is matched to, if any.
        position:
          type: [integer, 'null']
          description: The driver's place in line (1 is next). Null once they are no longer waiting.
        reservation:
          type: [object, 'null']
          properties:
            connectorId:
              type: integer
            status:
              type: string
            expiresAt:
              type: string
              format: date-time
        createdAt:
          type: string
          format: date-time

    Charge:
      type: object
      description: A charge for one session. Payer details and payment links are never returned.
      required: [id, stationId, transactionId, status, currency, amountCents, durationSeconds, createdAt]
      properties:
        id:
          type: string
        stationId:
          type: string
        transactionId:
          type: string
        status:
          type: string
          enum: [PENDING, PAID, NEEDS_REVIEW, NO_CHARGE]
          description: "PENDING: waiting for payment. NEEDS_REVIEW: no meter reading to bill from. NO_CHARGE: the amount came to zero."
        pricingModel:
          type: string
        pricingNote:
          type: [string, 'null']
          description: A short summary when surge or complimentary pricing changed the amount.
        currency:
          type: string
        amountCents:
          type: integer
          description: The amount still owed, in the smallest currency unit.
        durationSeconds:
          type: integer
        energyWh:
          type: [integer, 'null']
        provider:
          type: [string, 'null']
        paidAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time

    PriceRule:
      type: object
      required: [id, kind, scope, label, startsAt]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [SURGE, COMPLIMENTARY]
        scope:
          type: string
          enum: [NETWORK, SITE, ZONE, STATION, POWER_TYPE]
        zoneId:
          type: [string, 'null']
        stationId:
          type: [string, 'null']
        powerClass:
          type: [string, 'null']
          enum: [AC, DC, null]
        percent:
          type: [number, 'null']
          description: For SURGE, the change in percent (-99 to 300). Null for COMPLIMENTARY.
        label:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: [string, 'null']
          format: date-time
          description: Null means the rule runs until it is deleted.

    PriceRuleInput:
      type: object
      properties:
        kind:
          type: string
          enum: [SURGE, COMPLIMENTARY]
        scope:
          type: string
          enum: [SITE, ZONE, STATION, POWER_TYPE]
          description: NETWORK is for the installation administrator only.
        zoneId:
          type: [string, 'null']
          description: Required when scope is ZONE.
        stationId:
          type: [string, 'null']
          description: Required when scope is STATION.
        powerClass:
          type: [string, 'null']
          enum: [AC, DC, null]
          description: Required when scope is POWER_TYPE.
        percent:
          type: [number, 'null']
          minimum: -99
          maximum: 300
          description: Required for SURGE.
        label:
          type: string
          description: What drivers and reports call this change.
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: [string, 'null']
          format: date-time

    Alert:
      type: object
      required: [id, scope, severity, message, startsAt]
      properties:
        id:
          type: string
        scope:
          type: string
          enum: [NETWORK, SITE, LOCATION, STATION]
        stationId:
          type: [string, 'null']
        location:
          type: [string, 'null']
        severity:
          type: string
          enum: [INFO, WARNING]
        message:
          type: string
          maxLength: 500
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: [string, 'null']
          format: date-time

    AlertInput:
      type: object
      properties:
        scope:
          type: string
          enum: [SITE, LOCATION, STATION]
          description: NETWORK is for the installation administrator only.
        stationId:
          type: [string, 'null']
          description: Required when scope is STATION.
        location:
          type: [string, 'null']
          description: Required when scope is LOCATION. Must match a location a charge point has.
        severity:
          type: string
          enum: [INFO, WARNING]
          default: INFO
        message:
          type: string
          maxLength: 500
        startsAt:
          type: string
          format: date-time
          description: When drivers start seeing the alert. Defaults to now.
        endsAt:
          type: [string, 'null']
          format: date-time

    Complaint:
      type: object
      required: [id, status, createdAt, station, queueEntry]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [OPEN, RESOLVED, DISMISSED]
        note:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: [string, 'null']
          format: date-time
        station:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
        queueEntry:
          type: object
          description: The waitlist entry the complaint is about. Only its ID and status are returned; the driver's details are not.
          properties:
            id:
              type: string
            status:
              type: string

    ConfirmEndSession:
      type: object
      properties:
        confirmEndSession:
          type: boolean
