  /reports/idle:
    get:
      tags: [Reports]
      operationId: getIdleReport
      summary: Report on idle time at charge points
      description: Sessions that ended but kept the connector occupied for at least `minMinutes`.
      x-required-permission: api.reports.read
      parameters:
        - name: days
          in: query
