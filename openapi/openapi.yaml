          description: How many days back to look (1 to 90).
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 7
        - name: minMinutes
          in: query
          required: false
          description: Only idle periods at least this long (0 to 1440).
          schema:
            type: integer
            minimum: 0
            maximum: 1440
            default: 10
      responses:
        '200':
          description: The idle report.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
